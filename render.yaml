services:
  - type: web
    name: bonfire
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bonfire-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true

databases:
  - name: bonfire-db
    plan: free
    databaseName: bonfire
    user: bonfire
