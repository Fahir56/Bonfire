plugins { id 'com.android.application' }

android {
    namespace 'com.bonfire.next'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bonfire.next'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '4.0'
    }
    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
